<!doctype html>
<!--
  PROTOTYPE, throwaway (Phase 1, round 1).
  Question: what overall visual direction should Willow take?
  Six directions of the same canvas scene, switchable via ?variant=A..F,
  the bottom bar, or the arrow keys. Open this file directly in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Willow visual language · round 1 (A–F)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Manrope:wght@400;500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a2b2e; font-family: -apple-system, system-ui, sans-serif; color: #ddd; min-height: 100vh; }
  #stage { display: flex; gap: 24px; padding: 24px 24px 90px; align-items: flex-start; justify-content: center; }

  /* window */
  .win { position: relative; width: 1180px; height: 740px; border-radius: 12px; overflow: hidden;
         box-shadow: 0 0 0 0.5px rgba(0,0,0,.5), 0 20px 60px rgba(0,0,0,.45); }
  .canvas { position: absolute; inset: 0; }
  .titlebar { position: absolute; top: 0; left: 0; right: 0; height: 38px; display: flex; align-items: center; padding-left: 14px; gap: 8px; z-index: 5; }
  .tl { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.18); }
  .doc-title { position: absolute; left: 0; right: 0; text-align: center; font: 500 13px -apple-system, system-ui; color: rgba(0,0,0,.45); pointer-events: none; }
  svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .shape { position: absolute; text-align: justify; hyphens: auto; }
  .shape b { font-weight: 700; }
  .mid { position: absolute; transform: translate(-50%, -50%); }
  .caret { display: inline-block; width: 1.5px; height: 1.15em; vertical-align: -0.2em; margin-left: 1px; animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sel-text { border-radius: 2px; }

  .menu { position: absolute; z-index: 6; min-width: 196px; }
  .menu .swatches { display: flex; gap: 7px; }
  .menu .sw { width: 18px; height: 18px; border-radius: 50%; position: relative; }
  .menu .item { display: flex; justify-content: space-between; }
  .menu .item .k { opacity: .45; }
  .cursor { position: absolute; z-index: 7; width: 16px; height: 20px; }

  /* token panel */
  #tokens { width: 300px; font: 12px/1.5 ui-monospace, Menlo, monospace; background: #1d1e20; border-radius: 10px; padding: 14px 16px; color: #cfd2d6; }
  #tokens h3 { margin: 0 0 8px; font: 600 13px -apple-system, system-ui; color: #fff; }
  #tokens .row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid #2c2e31; padding: 3px 0; }
  #tokens .row span:last-child { color: #fff; text-align: right; }
  #tokens .pal { display: grid; grid-template-columns: 58px 1fr 1fr; gap: 4px 8px; align-items: center; margin-top: 8px; }
  #tokens .chip { height: 16px; border-radius: 4px; display: flex; align-items: center; padding-left: 5px; font-size: 10px; color: rgba(0,0,0,.6); }
  #tokens p { color: #9ba0a6; font-family: -apple-system, system-ui; font-size: 12px; margin: 10px 0 0; }

  /* switcher: deliberately not part of the design */
  #switcher { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
              background: #000; color: #fff; border-radius: 999px; padding: 6px; font: 600 13px -apple-system, system-ui;
              box-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 1px #ff0; z-index: 100; }
  #switcher button { background: #222; color: #fff; border: 0; border-radius: 999px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; }
  #switcher button:hover { background: #444; }
  #switcher .lbl { padding: 0 14px; min-width: 260px; text-align: center; }
  body.shot #tokens, body.shot #switcher { display: none; }
  body.shot #stage { padding: 0; justify-content: flex-start; }
  body.shot .win { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="win" id="win">
    <div class="canvas" id="canvas"><svg class="links" id="links"></svg></div>
    <div class="titlebar"><div class="tl" style="background:#ff5f57"></div><div class="tl" style="background:#febc2e"></div><div class="tl" style="background:#28c840"></div><div class="doc-title">Gull Rock.willow</div></div>
  </div>
  <div id="tokens"></div>
</div>
<div id="switcher"><button id="prev">←</button><div class="lbl" id="lbl"></div><button id="next">→</button></div>

<script>
// Palette order is fixed; names are provisional.
const NAMES = ['neutral', 'rose', 'peach', 'butter', 'sage', 'sky', 'lilac'];

const VARIANTS = {
  A: {
    name: 'Paper',
    blurb: 'Warm and writerly. Cream paper with a faint dot grid, a serif for story text, borderless shapes lifted by soft warm shadows.',
    font: "'Literata', Georgia, serif", size: 15, lh: 1.5, weight: 400,
    canvas: '#f6f3ec', grid: 'radial-gradient(circle, rgba(70,50,20,.10) 1px, transparent 1.2px) 0 0/24px 24px',
    ink: '#3b342c', radius: 14, pad: '13px 16px', width: 210,
    border: () => 'none',
    shadow: '0 1px 2px rgba(70,50,20,.07), 0 4px 14px rgba(70,50,20,.08)',
    link: { color: '#cbbfae', width: 2, cap: 'round' },
    select: c => `0 0 0 2px ${'#f6f3ec'}, 0 0 0 4px #8b7760, 0 1px 2px rgba(70,50,20,.07), 0 6px 18px rgba(70,50,20,.12)`,
    hoverLink: { color: '#8b7760', width: 3 },
    mid: { size: 9, fill: '#fff', stroke: '#8b7760', sw: 1.5 },
    caret: '#3b342c', textSel: 'rgba(139,119,96,.22)',
    pastel: ['#e9e5dd', '#f3d8d3', '#f6dfc8', '#f2e8c0', '#d9e5cf', '#d3e0ea', '#e2d8ea'],
    picker: ['#a39b8f', '#d9776c', '#e3955a', '#d2ad3a', '#7ea468', '#5d8fbf', '#9479b8'],
    menu: { bg: '#fffdf8', ink: '#3b342c', radius: 10, shadow: '0 0 0 1px rgba(70,50,20,.08), 0 10px 30px rgba(70,50,20,.18)', font: "-apple-system, system-ui", hover: '#f1ebe0' },
  },
  B: {
    name: 'Ink',
    blurb: 'Crisp and diagrammatic. Pure white, no texture, flat shapes defined by a fine darker border, a neutral grotesk, no shadows at rest.',
    font: "'Inter', system-ui, sans-serif", size: 14, lh: 1.5, weight: 400,
    canvas: '#ffffff', grid: 'none',
    ink: '#1f2328', radius: 7, pad: '11px 13px', width: 200,
    border: i => `1.25px solid ${VARIANTS.B.edge[i]}`,
    shadow: 'none',
    link: { color: '#9aa3ad', width: 1.5, cap: 'butt' },
    select: () => '0 0 0 2px #2f6fed, 0 0 0 6px rgba(47,111,237,.14)',
    hoverLink: { color: '#2f6fed', width: 2.5 },
    mid: { size: 8, fill: '#2f6fed', stroke: '#fff', sw: 1.5 },
    caret: '#2f6fed', textSel: 'rgba(47,111,237,.20)',
    pastel: ['#f1f3f5', '#fde4e6', '#ffe8d1', '#fff3c4', '#d8f5dd', '#d6ecff', '#e8e0ff'],
    edge:   ['#c4cad1', '#eba7ad', '#efbb87', '#dcc560', '#86c992', '#7fb6e6', '#ab93e3'],
    picker: ['#868e96', '#f0525f', '#fd7e14', '#f5b000', '#37b24d', '#228be6', '#7950f2'],
    menu: { bg: '#ffffff', ink: '#1f2328', radius: 7, shadow: '0 0 0 1px rgba(31,35,40,.12), 0 8px 24px rgba(31,35,40,.12)', font: "'Inter', system-ui", hover: '#eef3fe' },
  },
  C: {
    name: 'Pebble',
    blurb: 'Soft and tactile. Cool gray canvas, very round puffy shapes with a top highlight and deep soft shadow, a rounded sans, chunky connectors.',
    font: "'Nunito', system-ui, sans-serif", size: 15, lh: 1.45, weight: 500,
    canvas: '#eceff3', grid: 'none',
    ink: '#2e3440', radius: 22, pad: '15px 20px', width: 214,
    border: () => 'none',
    shadow: 'inset 0 1px 0 rgba(255,255,255,.75), 0 1px 1px rgba(30,40,60,.05), 0 10px 24px rgba(30,40,60,.11)',
    link: { color: '#c2c8d1', width: 3.5, cap: 'round' },
    select: (i) => `inset 0 1px 0 rgba(255,255,255,.75), 0 0 0 3px #eceff3, 0 0 0 6px ${VARIANTS.C.picker[i]}, 0 12px 28px rgba(30,40,60,.16)`,
    hoverLink: { color: '#8a93a3', width: 5 },
    mid: { size: 12, fill: '#fff', stroke: 'rgba(30,40,60,.18)', sw: 1 },
    caret: '#2e3440', textSel: 'rgba(74,163,255,.25)',
    pastel: ['#f7f8fa', '#ffd9e2', '#ffdfc6', '#fff0b8', '#cff0de', '#d2e7ff', '#e7ddff'],
    picker: ['#a3aab4', '#ff6b8b', '#ff9a52', '#f2c218', '#38c98a', '#4aa3ff', '#9b6bff'],
    menu: { bg: '#ffffff', ink: '#2e3440', radius: 16, shadow: '0 2px 4px rgba(30,40,60,.06), 0 16px 40px rgba(30,40,60,.18)', font: "'Nunito', system-ui", hover: '#f0f3f7' },
  },
  D: {
    name: 'Swiss',
    blurb: 'Graphic and structured. Light gray canvas with a fine square grid, near-square shapes outlined in the chain color, dark ink connectors, black selection.',
    font: "'IBM Plex Sans', system-ui, sans-serif", size: 14, lh: 1.45, weight: 400,
    canvas: '#f3f3f1', grid: 'linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px) 0 0/32px 32px, linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px) 0 0/32px 32px',
    ink: '#151515', radius: 3, pad: '11px 13px', width: 200,
    border: i => `2px solid ${VARIANTS.D.picker[i]}`,
    shadow: 'none',
    link: { color: '#151515', width: 1.5, cap: 'square' },
    select: () => '0 0 0 3px #f3f3f1, 0 0 0 5px #151515',
    hoverLink: { color: '#151515', width: 3 },
    mid: { size: 8, fill: '#151515', stroke: '#fff', sw: 1.5, square: true },
    caret: '#151515', textSel: 'rgba(255,214,0,.55)',
    pastel: ['#e4e4e1', '#f8d6d2', '#fadcc0', '#f7ebb0', '#d4e8cc', '#cfe0f2', '#e2d6f0'],
    picker: ['#8c8c88', '#e5413a', '#f27b1a', '#e8b400', '#3a9a4a', '#1f6fd1', '#7a45c8'],
    menu: { bg: '#ffffff', ink: '#151515', radius: 2, shadow: '0 0 0 1.5px #151515, 4px 4px 0 rgba(0,0,0,.12)', font: "'IBM Plex Sans', system-ui", hover: '#fff1a8' },
  },
  E: {
    name: 'Halo',
    blurb: 'Airy and luminous. Near-white canvas, shapes glow with a soft shadow tinted by their own chain color, connectors take the chain color too, frosted menus.',
    font: "'Manrope', system-ui, sans-serif", size: 14.5, lh: 1.5, weight: 500,
    canvas: '#fbfbfd', grid: 'none',
    ink: '#24233a', radius: 16, pad: '13px 16px', width: 206,
    border: () => '1px solid rgba(255,255,255,.9)',
    shadow: i => `0 1px 2px rgba(36,35,58,.05), 0 8px 26px ${VARIANTS.E.picker[i]}40`,
    link: { color: i => VARIANTS.E.picker[i] + '99', width: 2, cap: 'round' },
    select: i => `0 0 0 2px #fff, 0 0 0 4px ${VARIANTS.E.picker[i]}, 0 10px 30px ${VARIANTS.E.picker[i]}55`,
    hoverLink: { color: i => VARIANTS.E.picker[i], width: 3.5 },
    mid: { size: 10, fill: '#fff', stroke: 'rgba(36,35,58,.25)', sw: 1 },
    caret: '#5b4dff', textSel: 'rgba(91,77,255,.18)',
    pastel: ['#f0f0f4', '#fde1e7', '#ffe6d3', '#fff2c8', '#daf3e4', '#dceaff', '#ebe2ff'],
    picker: ['#9a9aad', '#f2577a', '#ff8a4c', '#f0b90b', '#2fbf7a', '#3d8bff', '#8f5bff'],
    menu: { bg: 'rgba(255,255,255,.72)', ink: '#24233a', radius: 14, shadow: '0 0 0 1px rgba(36,35,58,.08), 0 18px 50px rgba(36,35,58,.18)', font: "'Manrope', system-ui", hover: 'rgba(91,77,255,.08)', blur: true },
  },
  F: {
    name: 'Clear',
    blurb: 'Legibility first. Atkinson Hyperlegible at a larger size, stronger pastels, darker connectors and a thick ink selection so everything reads at a glance.',
    font: "'Atkinson Hyperlegible', system-ui, sans-serif", size: 16, lh: 1.45, weight: 400,
    canvas: '#fafaf8', grid: 'none',
    ink: '#111111', radius: 11, pad: '13px 15px', width: 220,
    border: () => '1px solid rgba(0,0,0,.10)',
    shadow: '0 1px 2px rgba(0,0,0,.08), 0 3px 8px rgba(0,0,0,.05)',
    link: { color: '#6b6b6b', width: 2.5, cap: 'round' },
    select: () => '0 0 0 3px #111111, 0 3px 10px rgba(0,0,0,.12)',
    hoverLink: { color: '#111111', width: 4 },
    mid: { size: 11, fill: '#111111', stroke: '#fff', sw: 2 },
    caret: '#111111', textSel: 'rgba(0,102,255,.25)',
    pastel: ['#e2e2df', '#f9c9c9', '#fcd3ae', '#f8e59a', '#c5e6c0', '#c2dcf7', '#ddcdf5'],
    picker: ['#7d7d78', '#d93b3b', '#e86a10', '#d6a300', '#2e8b3e', '#1a66cc', '#7340c4'],
    menu: { bg: '#ffffff', ink: '#111111', radius: 10, shadow: '0 0 0 1px rgba(0,0,0,.14), 0 10px 28px rgba(0,0,0,.16)', font: "'Atkinson Hyperlegible', system-ui", hover: '#e9f0ff' },
  },
};
const val = (x, i) => typeof x === 'function' ? x(i) : x;

// Scene: a trunk with two branches beside it and one stray note. Color is per chain.
const C = { trunk: 5, ferry: 1, mara: 4, note: 0 };
const SHAPES = [
  { id: 't1', x: 470, y: 70,  c: C.trunk, html: 'Mara inherits the lighthouse on Gull Rock from an aunt she never met.' },
  { id: 't2', x: 470, y: 185, c: C.trunk, html: 'The lamp won’t light, and the town blames her for the wreck.', state: 'selected' },
  { id: 't3', x: 470, y: 300, c: C.trunk, html: 'A storm strands the ferry and its passengers on the rock.', state: 'hover' },
  { id: 't4', x: 470, y: 415, c: C.trunk, html: '<b>Someone</b> has been tending the lamp <i>at night</i><span class="caret"></span>', state: 'editing' },
  { id: 't5', x: 470, y: 545, c: C.trunk, html: 'The keeper’s logbook names her <span class="sel-text">mother</span>.' },
  { id: 'f1', x: 150, y: 265, c: C.ferry, html: 'Ferryman: hides the crates below deck.' },
  { id: 'f2', x: 150, y: 370, c: C.ferry, html: 'Ferryman: lies to the harbourmaster about the cargo.' },
  { id: 'm1', x: 790, y: 150, c: C.mara,  html: 'Mara: searches the parish archive.' },
  { id: 'm2', x: 790, y: 255, c: C.mara,  html: 'Mara: finds a page torn from the logbook.' },
  { id: 'n1', x: 150, y: 95,  c: C.note,  html: 'Who rings the bell at dawn?' },
];
const LINKS = [['t1','t2'],['t2','t3'],['t3','t4'],['t4','t5'],['f1','f2'],['m1','m2','hover']];
const MENU_ON = 'm2';

const keys = Object.keys(VARIANTS);
let cur = new URLSearchParams(location.search).get('variant');
if (!VARIANTS[cur]) cur = 'A';

function render() {
  const v = VARIANTS[cur];
  const canvas = document.getElementById('canvas');
  const links = document.getElementById('links');
  canvas.querySelectorAll('.shape,.mid,.menu,.cursor').forEach(e => e.remove());
  canvas.style.background = v.grid === 'none' ? v.canvas : `${v.grid}, ${v.canvas}`;
  document.querySelector('.doc-title').style.color = v.ink + '88';

  const els = {};
  for (const s of SHAPES) {
    const d = document.createElement('div');
    d.className = 'shape';
    d.innerHTML = s.html;
    Object.assign(d.style, {
      left: s.x + 'px', top: s.y + 'px', width: v.width + 'px', padding: v.pad,
      background: v.pastel[s.c], color: v.ink, borderRadius: v.radius + 'px',
      font: `${v.weight} ${v.size}px/${v.lh} ${v.font}`, border: v.border(s.c),
      boxShadow: (s.state === 'selected' || s.state === 'editing') ? v.select(s.c) : val(v.shadow, s.c),
    });
    canvas.appendChild(d);
    els[s.id] = d;
    d.querySelectorAll('.caret').forEach(c => c.style.background = v.caret);
    d.querySelectorAll('.sel-text').forEach(c => c.style.background = v.textSel);
  }

  // connectors: side midpoint to facing side midpoint, drawn under shapes
  const r = id => { const e = els[id]; return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight }; };
  links.innerHTML = '';
  for (const [a, b, st] of LINKS) {
    const A = r(a), B = r(b);
    const vertical = Math.abs((B.y + B.h/2) - (A.y + A.h/2)) > Math.abs((B.x + B.w/2) - (A.x + A.w/2));
    const [x1, y1, x2, y2] = vertical
      ? [A.x + A.w/2, A.y + A.h, B.x + B.w/2, B.y]
      : [A.x + A.w, A.y + A.h/2, B.x, B.y + B.h/2];
    const L = st === 'hover' ? v.hoverLink : v.link;
    const chain = SHAPES.find(s => s.id === a).c;
    links.insertAdjacentHTML('beforeend', `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${val(L.color, chain)}" stroke-width="${L.width}" stroke-linecap="${v.link.cap}"/>`);
  }

  // hover midpoint circles on t3
  const H = r('t3');
  for (const [mx, my] of [[H.x + H.w/2, H.y], [H.x + H.w, H.y + H.h/2], [H.x + H.w/2, H.y + H.h], [H.x, H.y + H.h/2]]) {
    const m = document.createElement('div');
    m.className = 'mid';
    Object.assign(m.style, { left: mx + 'px', top: my + 'px', width: v.mid.size + 'px', height: v.mid.size + 'px', borderRadius: v.mid.square ? '1px' : '50%',
      background: v.mid.fill, boxShadow: `0 0 0 ${v.mid.sw}px ${v.mid.stroke}, 0 1px 3px rgba(0,0,0,.12)` });
    canvas.appendChild(m);
  }
  // resize cursor near t1's right edge
  const T1 = r('t1');
  const cur1 = document.createElement('div');
  cur1.className = 'cursor';
  cur1.style.left = (T1.x + T1.w - 8) + 'px'; cur1.style.top = (T1.y + T1.h/2 - 10) + 'px';
  cur1.innerHTML = `<svg width="22" height="16" viewBox="0 0 22 16"><path d="M1 8l5-5v3h10V3l5 5-5 5v-3H6v3z" fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  canvas.appendChild(cur1);

  // shape context menu on m2
  const M = r(MENU_ON);
  const mv = v.menu;
  const menu = document.createElement('div');
  menu.className = 'menu';
  Object.assign(menu.style, { left: (M.x + M.w - 30) + 'px', top: (M.y + M.h - 8) + 'px', background: mv.bg, color: mv.ink,
    borderRadius: mv.radius + 'px', boxShadow: mv.shadow, font: `500 13px/1 ${mv.font}`, padding: '6px', backdropFilter: mv.blur ? 'blur(18px) saturate(1.6)' : '' });
  const item = (t, k, hov) => `<div class="item" style="padding:7px 10px;border-radius:${Math.max(mv.radius - 4, 3)}px;${hov ? `background:${mv.hover}` : ''}"><span>${t}</span><span class="k">${k}</span></div>`;
  const sw = v.picker.map((p, i) => `<div class="sw" title="${NAMES[i]}" style="background:${p};${i === C.mara ? `box-shadow:0 0 0 2px ${mv.bg}, 0 0 0 3.5px ${p}` : ''}"></div>`).join('');
  menu.innerHTML = item('Cut', '⌘X') + item('Copy', '⌘C', true) + item('Paste', '⌘V') + item('Duplicate', '⌘D')
    + `<div style="height:1px;background:${mv.ink}18;margin:5px 4px"></div>`
    + `<div style="padding:6px 10px 4px;opacity:.55;font-size:11.5px">Color</div><div class="swatches" style="padding:4px 10px 8px">${sw}</div>`;
  canvas.appendChild(menu);

  // tokens panel
  const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
  document.getElementById('tokens').innerHTML = `<h3>${cur} · ${v.name}</h3>`
    + row('font', v.font.split(',')[0].replace(/'/g, '') + ` ${v.size}/${v.lh} w${v.weight}`)
    + row('shape width', v.width + ' px') + row('corner radius', v.radius + ' px') + row('padding', v.pad)
    + row('border', v.edge ? '1.25 px, darker tone' : v.border(0).replace(/rgba\([^)]*\)/, 'tint')) + row('depth', v.shadow === 'none' ? 'flat' : typeof v.shadow === 'function' ? 'chain-tinted glow' : 'soft shadow')
    + row('canvas', v.canvas + (v.grid === 'none' ? '' : v.grid.startsWith('radial') ? ' + dots' : ' + grid')) + row('connector', `${v.link.width} px ${typeof v.link.color === 'function' ? 'chain color' : v.link.color}`)
    + row('midpoint', v.mid.size + ' px')
    + `<div class="pal"><span></span><span style="opacity:.6">pastel</span><span style="opacity:.6">picker</span>`
    + NAMES.map((n, i) => `<span>${n}</span><div class="chip" style="background:${v.pastel[i]}">${v.pastel[i]}</div><div class="chip" style="background:${v.picker[i]};color:#fff">${v.picker[i]}</div>`).join('')
    + `</div><p>${v.blurb}</p>`;
  document.getElementById('lbl').textContent = `${cur} (${v.name})  ·  ${keys.indexOf(cur) + 1}/${keys.length}`;
}

function go(d) {
  cur = keys[(keys.indexOf(cur) + d + keys.length) % keys.length];
  try { history.replaceState(null, '', '?variant=' + cur); } catch {} // data: URLs refuse this
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
// ?shot: bare 1180x740 window for headless PNG capture
if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');
// Fit window + token panel to the viewport; the mockup itself stays 1:1 in its own coordinates.
const fit = () => document.getElementById('stage').style.zoom = document.body.classList.contains('shot') ? 1 : Math.min(1, innerWidth / (1180 + 300 + 72));
addEventListener('resize', fit); fit();
document.fonts.ready.then(render);
render();
</script>
</body>
</html>
