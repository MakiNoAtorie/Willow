[package]
name = "willow-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "willow"
path = "src/main.rs"

# GPUI pinned per docs/CONVENTIONS.md; `profiler` feeds `--bench` its frame timings. No runtime_shaders: build with the Metal Toolchain.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f", features = ["font-kit"] }
willow-core = { path = "../willow-core" }
# Native open/save panels with a `.willow` filter, which GPUI's panels lack.
rfd = { version = "0.17", default-features = false }

# The real macOS text system in tests; the platform around it needs the main thread.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f", features = ["font-kit"] }
